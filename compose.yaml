services:
  autoforge:
    build: .
    ports:
      - "4174:4174"
    environment:
      AUTOFORGE_REQUIRE_AUTH: "true"
      AUTOFORGE_DEMO_PASSWORD: "${AUTOFORGE_DEMO_PASSWORD:?Set AUTOFORGE_DEMO_PASSWORD}"
    volumes:
      - autoforge-data:/var/lib/autoforge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
volumes:
  autoforge-data:
